[package]
name = "tracenet"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "TraceNet P2P Open Traces node over iroh 0.97 (iroh-gossip + iroh-blobs + tracenet/handshake/v1 + privacy membrane)."

[dependencies]
iroh = "0.97"
iroh-gossip = "0.97"
iroh-blobs = "0.99"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
blake3 = "1"
hex = "0.4"
n0-future = "0.1"
futures-lite = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
