name: secrets-scan

# Full-history secrets scan on every push. Deliberately NO paths: filter —
# a leak scanner's correctness depends on seeing every commit (workspace CI
# rule explicitly exempts full-repo scanners).
on:
  workflow_dispatch:
  push:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gl.tar.gz
          tar -xzf /tmp/gl.tar.gz -C /tmp gitleaks
      - name: Scan full git history
        run: /tmp/gitleaks git --no-banner --redact .
